name: Recalculate Clusters

on:
  workflow_dispatch:  # Manual / API trigger

jobs:
  recluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Hugging Face Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-sentence-transformers-all-minilm-l6-v2

      - name: Run Cluster Recalculation Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        working-directory: backend
        run: |
          python scripts/recalculate_clusters.py
